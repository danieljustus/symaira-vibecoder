name: Release
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    environment: release
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Import signing certificate
        id: signing
        env:
          CERTIFICATE_P12: ${{ secrets.CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          if [ -z "${CERTIFICATE_P12:-}" ]; then
            echo "::warning::CERTIFICATE_P12 secret is not set. Building unsigned."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "signed=true" >> "$GITHUB_OUTPUT"
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          CERTIFICATE_PATH="$RUNNER_TEMP/certificate.p12"
          echo -n "$CERTIFICATE_P12" | base64 --decode -o "$CERTIFICATE_PATH"
          security import "$CERTIFICATE_PATH" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep "Developer ID Application" | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "CODESIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.4'

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}

      - name: Notarize macOS binaries
        if: steps.signing.outputs.signed == 'true'
        env:
          NOTARY_API_KEY: ${{ secrets.NOTARY_API_KEY }}
          NOTARY_API_ISSUER: ${{ secrets.NOTARY_API_ISSUER }}
          NOTARY_API_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
        run: |
          if [ -z "${NOTARY_API_KEY:-}" ]; then
            echo "::warning::NOTARY_API_KEY secret is not set. Skipping notarization."
            exit 0
          fi
          for ARCH in amd64 arm64; do
            for f in dist/*_darwin_${ARCH}/*; do
              if [ -f "$f" ] && file "$f" | grep -q "Mach-O"; then
                echo "Notarizing $f..."
                ZIP_PATH="$RUNNER_TEMP/notarize_${ARCH}.zip"
                ditto -c -k --keepParent "$f" "$ZIP_PATH"
                xcrun notarytool submit "$ZIP_PATH" \
                  --apple-id "${NOTARY_API_KEY_ID}" \
                  --team-id "${NOTARY_API_ISSUER}" \
                  --password "${NOTARY_API_KEY}" \
                  --wait
                rm -f "$ZIP_PATH"
              fi
            done
          done

      - name: Clean up signing material
        if: always()
        run: |
          if [ -n "${KEYCHAIN_PATH:-}" ] && [ -f "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true
          fi

  macos-gui-dmg:
    name: macOS GUI DMG
    runs-on: macos-15
    environment: release
    needs: release
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Determine version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"

      - name: Import signing certificate
        id: signing
        env:
          CERTIFICATE_P12: ${{ secrets.CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${CERTIFICATE_P12:-}" ]; then
            echo "::warning::CERTIFICATE_P12 secret is not set. Building unsigned."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "signed=true" >> "$GITHUB_OUTPUT"
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          CERTIFICATE_PATH="$RUNNER_TEMP/certificate.p12"
          echo -n "$CERTIFICATE_P12" | base64 --decode -o "$CERTIFICATE_PATH"
          security import "$CERTIFICATE_PATH" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep "Developer ID Application" | head -1 | sed 's/.*"\(.*\)".*/\1/')
          TEAM_ID=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep "Developer ID Application" | head -1 | sed 's/.*(\([A-Z0-9]*\)).*/\1/')
          if [ -z "$IDENTITY" ]; then
            echo "::error::No Developer ID Application identity found."
            exit 1
          fi
          echo "CODESIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "TEAM_ID=$TEAM_ID" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.4'

      - name: Build universal symvibe CLI for app bundle
        run: |
          set -euo pipefail
          GOOS=darwin GOARCH=amd64 go build -o symvibe-amd64 ./cmd/symvibe
          GOOS=darwin GOARCH=arm64 go build -o symvibe-arm64 ./cmd/symvibe
          lipo -create -output symvibe symvibe-amd64 symvibe-arm64
          rm symvibe-amd64 symvibe-arm64
          file symvibe
          if [ -n "${CODESIGN_IDENTITY:-}" ]; then
            codesign -f -s "$CODESIGN_IDENTITY" --timestamp --options runtime symvibe
          fi

      - name: Install XcodeGen
        run: brew install xcodegen 2>/dev/null || brew upgrade xcodegen 2>/dev/null || true

      - name: Set version in Info.plist
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          sed -i '' 's|<string>$(MARKETING_VERSION)</string>|<string>'"${VERSION}"'</string>|' client/Sources/SymvibeApp/Info.plist
          echo "Updated version to $VERSION"

      - name: Generate Xcode project
        run: cd client && xcodegen generate

      - name: Build and sign GUI app
        run: |
          cd client
          if [ "${{ steps.signing.outputs.signed }}" = "true" ]; then
            xcodebuild -project Symvibe.xcodeproj \
              -scheme Symvibe \
              -configuration Release \
              -derivedDataPath build \
              CODE_SIGN_STYLE=Manual \
              CODE_SIGN_IDENTITY="$CODESIGN_IDENTITY" \
              DEVELOPMENT_TEAM="$TEAM_ID" \
              CODE_SIGNING_ALLOWED=YES \
              CODE_SIGNING_REQUIRED=YES \
              OTHER_CODE_SIGN_FLAGS="--timestamp --options=runtime"
          else
            echo "::warning::Building GUI without code signing"
            xcodebuild -project Symvibe.xcodeproj \
              -scheme Symvibe \
              -configuration Release \
              -derivedDataPath build \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO
          fi
          APP_BUNDLE=$(find build -name 'Symvibe.app' -type d -maxdepth 6 | head -1)
          if [ -z "$APP_BUNDLE" ]; then
            echo "::error::App bundle not found after build"
            exit 1
          fi
          echo "APP_BUNDLE=$PWD/$APP_BUNDLE" >> "$GITHUB_ENV"

      - name: Prepare app bundle for notarization
        if: steps.signing.outputs.signed == 'true'
        env:
          NOTARY_API_KEY: ${{ secrets.NOTARY_API_KEY }}
          NOTARY_API_ISSUER: ${{ secrets.NOTARY_API_ISSUER }}
          NOTARY_API_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
        run: |
          APP="${{ env.APP_BUNDLE }}"
          if [ -z "$APP" ] || [ ! -d "$APP" ]; then
            echo "::error::App bundle not found"
            exit 1
          fi
          ZIP_PATH="$RUNNER_TEMP/Symvibe.zip"
          ditto -c -k --keepParent "$APP" "$ZIP_PATH"
          if [ -n "${NOTARY_API_KEY:-}" ]; then
            KEY_FILE="$RUNNER_TEMP/notary-api-key.p8"
            echo -n "${NOTARY_API_KEY}" | base64 --decode > "$KEY_FILE"
            set +e
            xcrun notarytool submit "$ZIP_PATH" \
              -k "$KEY_FILE" \
              -d "${NOTARY_API_KEY_ID}" \
              -i "${NOTARY_API_ISSUER}" \
              --wait
            NOTARY_EXIT=$?
            set -e
            rm -f "$KEY_FILE"
            if [ $NOTARY_EXIT -eq 0 ]; then
              xcrun stapler staple "$APP"
              echo "Notarization complete"
            else
              echo "::warning::Notarization failed (exit $NOTARY_EXIT). DMG will be unsigned."
            fi
          else
            echo "::warning::NOTARY_API_KEY not set. Skipping notarization."
          fi

      - name: Create DMG
        id: dmg
        run: |
          APP="${{ env.APP_BUNDLE }}"
          if [ -z "$APP" ] || [ ! -d "$APP" ]; then
            echo "::error::App bundle not found for DMG creation"
            exit 1
          fi
          VERSION="${{ steps.version.outputs.version }}"
          DMG_PATH="$RUNNER_TEMP/Symvibe-$VERSION.dmg"
          DMG_STAGING="$RUNNER_TEMP/dmg-staging"
          mkdir -p "$DMG_STAGING"
          cp -R "$APP" "$DMG_STAGING/"
          hdiutil create -volname "Symvibe $VERSION" \
            -srcfolder "$DMG_STAGING" \
            -ov -format UDZO \
            "$DMG_PATH"
          echo "dmg_path=$DMG_PATH" >> "$GITHUB_OUTPUT"
          echo "dmg_name=Symvibe-$VERSION.dmg" >> "$GITHUB_OUTPUT"

      - name: Upload GUI app to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ steps.version.outputs.tag }}" \
            "${{ steps.dmg.outputs.dmg_path }}" --clobber

      - name: Clean up signing material
        if: always()
        run: |
          if [ -n "${KEYCHAIN_PATH:-}" ] && [ -f "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true
          fi

  bump-homebrew-cask:
    name: Bump Homebrew cask
    runs-on: macos-15
    environment: release
    needs: macos-gui-dmg
    steps:
      - name: Checkout Homebrew tap
        uses: actions/checkout@v7
        with:
          repository: danieljustus/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          path: homebrew-tap

      - name: Determine version
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"

      - name: Download release DMG and compute checksum
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          DMG_URL="https://github.com/danieljustus/symaira-vibecoder/releases/download/${{ steps.version.outputs.tag }}/Symvibe-${VERSION}.dmg"
          curl -fsSL -o "Symvibe-${VERSION}.dmg" "$DMG_URL"
          SHA256=$(shasum -a 256 "Symvibe-${VERSION}.dmg" | awk '{print $1}')
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "SHA256=$SHA256" >> "$GITHUB_ENV"

      - name: Write cask
        run: |
          set -euo pipefail
          mkdir -p homebrew-tap/Casks
          cat > homebrew-tap/Casks/symvibe.rb <<EOF
          cask "symvibe" do
            version "${VERSION}"
            sha256 "${SHA256}"

            url "https://github.com/danieljustus/symaira-vibecoder/releases/download/v#{version}/Symvibe-#{version}.dmg"
            name "Symaira VibeCoder"
            desc "Graphical Vibe-Coding Baukasten that drives opencode"
            homepage "https://github.com/danieljustus/symaira-vibecoder"

            livecheck do
              url "https://github.com/danieljustus/symaira-vibecoder/releases/latest"
              strategy :header_match
              regex(/Symvibe-(\d+(?:\.\d+)*)\.dmg/i)
            end

            depends_on macos: :sonoma

            app "Symvibe.app"

            zap trash: [
              "~/Library/Application Support/dev.symaira.Symvibe",
              "~/Library/Preferences/dev.symaira.Symvibe.plist",
              "~/Library/Caches/dev.symaira.Symvibe",
            ]
          end
          EOF

      - name: Commit and push cask
        run: |
          set -euo pipefail
          cd homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/symvibe.rb
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Bump symvibe to v${VERSION}"
          git push
