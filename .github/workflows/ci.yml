name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'


concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12

  build-test:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          cache: true

      - name: gofmt
        run: |
          unformatted="$(gofmt -l ./cmd ./internal ./web/embed.go)"
          if [ -n "$unformatted" ]; then echo "needs gofmt:"; echo "$unformatted"; exit 1; fi

      - name: vet
        run: go vet ./...

      # Single pass: race detector + coverprofile in one run (previously
      # the suite ran twice — plain ./... plus -race ./internal/...).
      # -race needs cgo, so this step overrides the job-level CGO_ENABLED=0.
      # Verified locally: full suite green with -race (4.3s).
      - name: test (race + coverage)
        run: CGO_ENABLED=1 go test -race -coverprofile=coverage.out ./...

      - name: upload coverage profile
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-profile-${{ github.sha }}
          path: coverage.out
          retention-days: 1

      - name: build
        run: go build -ldflags "-X github.com/danieljustus/symaira-vibecoder/internal/version.Version=${GITHUB_SHA::12}" -o symvibe ./cmd/symvibe

      - name: wire-contract
        run: .github/scripts/check-wire-contract.sh

      - name: smoke
        run: ./symvibe version

  # Boots the real server (not just `version`) and asserts it comes up clean:
  # /api/version answers, / serves the embedded board, and the process exits
  # without panic:/level=ERROR on stderr. The log is always uploaded so a
  # startup failure is diagnosable.
  launch:
    needs: build-test
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          cache: true

      # Artifacts aren't shared between jobs, so rebuild the binary here.
      - name: build
        run: go build -o symvibe ./cmd/symvibe

      - name: boot server and assert it comes up clean
        shell: bash
        run: |
          set -euo pipefail

          port=4317
          base="http://127.0.0.1:${port}"
          log=server.log

          : > "$log"
          ./symvibe serve --no-open >"$log" 2>&1 &
          srv=$!
          cleanup() {
            kill "$srv" 2>/dev/null || true
            wait "$srv" 2>/dev/null || true
          }
          trap cleanup EXIT

          # Bounded poll: 30 attempts x 2s.
          up=0
          for i in $(seq 1 30); do
            if curl -sf "${base}/api/version" >/dev/null 2>&1; then
              echo "server answered ${base}/api/version on attempt ${i}"
              up=1
              break
            fi
            sleep 2
          done

          if [ "$up" -ne 1 ]; then
            echo "server never answered ${base}/api/version within 60s" >&2
            tail -n 50 "$log" >&2 || true
            exit 1
          fi

          # Assert / returns the embedded board.
          body="$(curl -sf "${base}/")"
          if ! grep -q "Baukasten Board" <<<"$body"; then
            echo "GET / did not return the embedded board" >&2
            exit 1
          fi

          # Assert /api/version carries the API contract version.
          vbody="$(curl -sf "${base}/api/version")"
          if ! grep -q '"api_version"' <<<"$vbody"; then
            echo "GET /api/version returned an unexpected payload" >&2
            exit 1
          fi

          echo "board and API verified — stopping server"

          # Stop the server, then check its output for startup errors.
          kill "$srv" 2>/dev/null || true
          wait "$srv" 2>/dev/null || true
          trap - EXIT

          if grep -Eq "panic:|level=ERROR" "$log"; then
            echo "server log contains panic: or level=ERROR — see uploaded server.log" >&2
            grep -E "panic:|level=ERROR" "$log" >&2 || true
            exit 1
          fi

          echo "server log clean (no panic:, no level=ERROR)"

      - name: upload server log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: launch-server-log-${{ github.sha }}
          path: server.log
          retention-days: 1

  vuln:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          cache: true

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  coverage:
    needs: build-test
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          cache: true

      # Reuses the coverprofile from build-test (no second suite run).
      - name: download coverage profile
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: coverage-profile-${{ github.sha }}

      - name: coverage
        run: .github/scripts/check-coverage.sh
        env:
          COVERAGE_PROFILE: coverage.out

      - name: upload coverage artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-artifacts-${{ github.sha }}
          path: |
            coverage.json
            badge.json
            badge.svg
          retention-days: 1

  # Publishes coverage.json, badge.json and badge.svg (generated by
  # check-coverage.sh) to the orphan `coverage-data` branch so the README
  # badge and external tooling can read a stable baseline.
  # NOTE: the `coverage-data` branch is exempt from the repo's
  # branch-cleanup policy — it is machine-updated and never merged.
  publish-coverage-data:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: coverage
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          cache: true

      # Publishes the artifacts produced by the coverage job — the suite
      # must NOT run a second time here.
      - name: download coverage artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: coverage-artifacts-${{ github.sha }}

      - name: publish to coverage-data branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p /tmp/coverage-data
          cp coverage.json badge.json badge.svg /tmp/coverage-data/
          git checkout --orphan coverage-data
          git rm -rf . >/dev/null 2>&1 || true
          cp /tmp/coverage-data/coverage.json /tmp/coverage-data/badge.json /tmp/coverage-data/badge.svg .
          git add coverage.json badge.json badge.svg
          if git diff --cached --quiet; then
            echo "coverage-data already up to date"
          else
            git commit -m "coverage: ${GITHUB_SHA::12}"
            git push --force origin coverage-data
          fi
